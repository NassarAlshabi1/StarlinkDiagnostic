// SpaceX Starlink Device gRPC protocol — API v42 layout
// ============================================================
// Field numbers verified against the CURRENT firmware generated
// descriptors (joshuasing/starlink_exporter, firmware 2026.06.22,
// API v42), cross-checked with sparky8512/starlink-grpc-tools.
//
// IMPORTANT differences vs the old (2021/2022) protoset we used in V2.0:
//   History:
//     - 1005/1006/1007 (snr/scheduled/obstructed) are GONE
//     - 1009 changed from varint uptime  -> repeated DishOutage (message)
//     - 1010 changed from varint redirect_start -> repeated float power_in
//       (wire-type conflicts silently dropped these before; fixed here)
//     - 1011 = EventLog (not parsed; visible via unknown-field walk)
//   Status:
//     - state (1006) and snr (1001) are GONE -> state is derived from
//       the outage message exactly like current starlink-grpc-tools
//     - gps_stats 1013->1015, eth_speed 1014->1016,
//       is_snr_above_noise_floor 1015->1018, is_snr_persistently_low 1016->1022
//     - alerts_hardware (was 1017) is GONE; 1017 is now mobility_class
//     - NEW: outage=1014, software_update_state=1021, disablement_code=1024,
//       software_update_stats=1026, alignment_stats=1027,
//       swupdate_reboot_ready=1030, reboot_reason=1032, upsu_stats=1043,
//       dl/ul_bandwidth_restricted_reason=1044/1045, battery_stats=1054
//   New RPCs used by V2.1:
//     get_ping=1009 (device-level ping targets), start_speedtest=1027,
//     get_speedtest_status=1028, dish_get_obstruction_map=2008,
//     dish_power_save=2013 (sleep schedule), dish_inhibit_gps=2014
//
// Enums live in this file (same package) with value names prefixed per
// enum to avoid proto3 sibling-scope collisions. Numbers are wire-identical
// to the real cross-package enums, so decoding is exact.

syntax = "proto3";

package SpaceX.API.Device;

service Device {
  rpc Handle (Request) returns (Response);
}

// ── envelope ─────────────────────────────────────────────────────────────

message Request {
  uint64 id = 1;
  string target_id = 13;
  uint64 epoch_id = 14;
  oneof request {
    RebootRequest reboot = 1001;
    SpeedTestRequest speed_test = 1003;
    GetStatusRequest get_status = 1004;
    GetHistoryRequest get_history = 1007;
    GetPingRequest get_ping = 1009;
    DishStowRequest dish_stow = 2002;
    DishGetObstructionMapRequest dish_get_obstruction_map = 2008;
    StartSpeedtestRequest start_speedtest = 1027;
    GetSpeedtestStatusRequest get_speedtest_status = 1028;
    DishPowerSaveRequest dish_power_save = 2013;
    DishInhibitGpsRequest dish_inhibit_gps = 2014;
    WifiGetStatusRequest wifi_get_status = 3004;
    WifiGetClientsRequest wifi_get_clients = 3002;
  }
}

message Response {
  uint64 id = 1;
  uint64 api_version = 3;
  oneof response {
    RebootResponse reboot = 1001;
    DishStowResponse dish_stow = 2002;
    DishGetStatusResponse dish_get_status = 2004;
    DishGetHistoryResponse dish_get_history = 2006;
    GetPingResponse get_ping = 1009;
    DishGetObstructionMapResponse dish_get_obstruction_map = 2008;
    GetSpeedtestStatusResponse get_speedtest_status = 1028;
    DishInhibitGpsResponse dish_inhibit_gps = 2013;
    WifiGetStatusResponse wifi_get_status = 3004;
    WifiGetClientsResponse wifi_get_clients = 3002;
  }
}

message GetStatusRequest {}
message GetHistoryRequest {}
message GetPingRequest {}
message RebootRequest {}
message RebootResponse {}
message GetSpeedtestStatusRequest {}

message DishStowRequest {
  bool unstow = 1;
}
message DishStowResponse {}

message DishGetObstructionMapRequest {}
message DishInhibitGpsRequest {
  bool inhibit_gps = 1;
}
message DishInhibitGpsResponse {}

message DishPowerSaveRequest {
  // minutes from local midnight; 0 duration = all night pattern used by app
  uint32 power_save_start_minutes = 1;
  uint32 power_save_duration_minutes = 2;
  bool enable_power_save = 3;
}

message StartSpeedtestRequest {
  int32 duration_s = 1;
  bool send_telemetry = 2;
}

// ── status ───────────────────────────────────────────────────────────────

message DishGetStatusResponse {
  DeviceInfo device_info = 1;
  DeviceState device_state = 2;
  float seconds_to_first_nonempty_slot = 1002;
  float pop_ping_drop_rate = 1003;
  DishObstructionStats obstruction_stats = 1004;
  DishAlerts alerts = 1005;
  float downlink_throughput_bps = 1007;
  float uplink_throughput_bps = 1008;
  float pop_ping_latency_ms = 1009;
  bool stow_requested = 1010;
  float boresight_azimuth_deg = 1011;
  float boresight_elevation_deg = 1012;
  DishOutage outage = 1014;
  DishGpsStats gps_stats = 1015;
  int32 eth_speed_mbps = 1016;
  UserMobilityClass mobility_class = 1017;
  bool is_snr_above_noise_floor = 1018;
  DishReadyStates ready_states = 1019;
  UserClassOfService class_of_service = 1020;
  SoftwareUpdateState software_update_state = 1021;
  bool is_snr_persistently_low = 1022;
  UtDisablementCode disablement_code = 1024;
  SoftwareUpdateStats software_update_stats = 1026;
  AlignmentStats alignment_stats = 1027;
  bool swupdate_reboot_ready = 1030;
  int32 seconds_until_swupdate_reboot_possible = 1031;
  RebootReason reboot_reason = 1032;
  DishUpsuStats upsu_stats = 1043;
  RateLimitReason dl_bandwidth_restricted_reason = 1044;
  RateLimitReason ul_bandwidth_restricted_reason = 1045;
  DishBatteryStats battery_stats = 1054;
}

message DeviceInfo {
  string id = 1;
  string hardware_version = 2;
  string software_version = 3;
  string country_code = 4;
  int32 utc_offset_s = 5;
  bool software_partitions_equal = 6;
  bool is_dev = 7;
  int32 bootcount = 8;
  int32 anti_rollback_version = 9;
  bool is_hitl = 10;
  string manufactured_version = 11;
  int64 generation_number = 12;
  bool dish_cohoused = 13;
  int32 board_rev = 14;
  string build_id = 15;
  HardwareIndex hardware_index = 16;
}

message DeviceState {
  uint64 uptime_s = 1;
}

message DishObstructionStats {
  float fraction_obstructed = 1;
  float valid_s = 4;
  bool currently_obstructed = 5;
  float avg_prolonged_obstruction_duration_s = 6;
  float avg_prolonged_obstruction_interval_s = 7;
  bool avg_prolonged_obstruction_valid = 8;
  float time_obstructed = 9;
  uint32 patches_valid = 10;
}

message DishAlerts {
  bool motors_stuck = 1;
  bool thermal_shutdown = 2;
  bool thermal_throttle = 3;
  bool unexpected_location = 4;
  bool mast_not_near_vertical = 5;
  bool slow_ethernet_speeds = 6;
  bool roaming = 7;
  bool install_pending = 8;
  bool is_heating = 9;
  bool power_supply_thermal_throttle = 10;
  bool is_power_save_idle = 11;
  bool dbf_telem_stale = 14;
  bool low_motor_current = 16;
  bool lower_signal_than_predicted = 17;
  bool slow_ethernet_speeds_100 = 18;
  bool obstruction_map_reset = 19;
  bool dish_water_detected = 20;
  bool router_water_detected = 21;
  bool upsu_router_port_slow = 22;
  bool no_ethernet_link = 23;
}

message DishGpsStats {
  bool gps_valid = 1;
  uint32 gps_sats = 2;
  bool no_sats_after_ttff = 3;
  // local `optional` = wire-identical to the real (implicit-presence) field
  // but lets HasField() tell "announced" apart from "absent".
  optional bool inhibit_gps = 4;
  AttitudeEstimationState pnt_filter_convergence_state = 5;
}

message DishOutage {
  Cause cause = 1;
  int64 start_timestamp_ns = 2;
  uint64 duration_ns = 3;   // 0 = ongoing outage
  bool did_switch = 4;

  enum Cause {
    CAUSE_UNKNOWN = 0;
    CAUSE_BOOTING = 1;
    CAUSE_STOWED = 2;
    CAUSE_THERMAL_SHUTDOWN = 3;
    CAUSE_NO_SCHEDULE = 4;
    CAUSE_NO_SATS = 5;
    CAUSE_OBSTRUCTED = 6;
    CAUSE_NO_DOWNLINK = 7;
    CAUSE_NO_PINGS = 8;
    CAUSE_ACTUATOR_ACTIVITY = 9;
    CAUSE_CABLE_TEST = 10;
    CAUSE_SLEEPING = 11;
    CAUSE_SKY_SEARCH = 13;
    CAUSE_INHIBIT_RF = 14;
  }
}

message AlignmentStats {
  HasActuators has_actuators = 1;
  ActuatorState actuator_state = 2;
  float tilt_angle_deg = 3;
  float boresight_azimuth_deg = 4;
  float boresight_elevation_deg = 5;
  AttitudeEstimationState attitude_estimation_state = 6;
  float attitude_uncertainty_deg = 7;
  float desired_boresight_azimuth_deg = 8;
  float desired_boresight_elevation_deg = 9;
}

message SoftwareUpdateStats {
  SoftwareUpdateState software_update_state = 1;
  float software_update_progress = 2;   // 0..1
  bool update_requires_reboot = 3;
  int64 reboot_scheduled_utc_time = 4;
}

message DishReadyStates {
  bool cady = 1;
  bool scp = 2;
  bool l1l2 = 3;
  bool xphy = 4;
  bool aap = 5;
  bool rf = 6;
}

message DishUpsuStats {
  uint64 app_version = 2;
  uint64 boot_version = 3;
  uint64 rom_version = 4;
  int64 uptime = 5;
  float dish_power = 6;    // watts
  float router_power = 7;  // watts
}

message DishBatteryStats {
  uint32 state_of_charge = 1;
  bool is_charging = 2;
  PowerSource power_source = 3;
}

// ── history ──────────────────────────────────────────────────────────────

message DishGetHistoryResponse {
  uint64 current = 1;
  repeated float pop_ping_drop_rate = 1001;
  repeated float pop_ping_latency_ms = 1002;
  repeated float downlink_throughput_bps = 1003;
  repeated float uplink_throughput_bps = 1004;
  repeated DishOutage outages = 1009;   // outages overlapping the buffer
  repeated float power_in = 1010;       // watts, one per sample (v42)
}

// ── ping (device-level target results) ───────────────────────────────────

message GetPingResponse {
  map<string, PingResult> results = 1;
}

message PingResult {
  float drop_rate = 1;
  float latency_ms = 2;
  PingTarget target = 3;
}

message PingTarget {
  string service = 1;
  string location = 2;
  string address = 3;
}

// ── speedtest (dish-side, no phone internet needed) ──────────────────────

message GetSpeedtestStatusResponse {
  SpeedtestStatus status = 1;
}

message SpeedtestStatus {
  bool running = 1;
  uint32 id = 2;
  Direction up = 1000;
  Direction down = 1001;

  message Direction {
    repeated float throughputs_mbps = 1;
    int32 err = 2;   // SpeedtestError; kept as int (enum not fully public)
  }
}

message SpeedTestRequest {
  SpeedTestStats client_speedtest = 1;
  float client_rssi = 2;
}

message SpeedTestStats {
  float upload_mbps = 1;
  float download_mbps = 2;
  float latency_ms = 3;
  uint64 start_time = 4;
}

// ── router (same Device service on the router at 192.168.1.1:9000) ───────

message WifiGetStatusRequest {}
message WifiGetClientsRequest {}

message WifiGetStatusResponse {
  DeviceInfo device_info = 3;
  DeviceState device_state = 4;
  string ipv4_wan_address = 1003;
  optional float ping_drop_rate = 1004;
  optional float ping_latency_ms = 1005;
  optional float dish_ping_drop_rate = 1012;
  optional float dish_ping_latency_ms = 1013;
  optional float pop_ping_drop_rate = 1014;
  optional float pop_ping_latency_ms = 1015;
  optional float dish_ping_drop_rate_5m = 1018;
  optional float pop_ping_drop_rate_5m = 1020;
  optional float ping_drop_rate_5m = 1021;
}

message WifiGetClientsResponse {
  repeated WifiClient clients = 1;
}

message WifiClient {
  string name = 1;
  string mac_address = 2;
  string ip_address = 3;
  float signal_strength = 4;          // dBm (wifi clients)
  string given_name = 31;
  bool using_mlo = 71;
}

// ── obstruction map ──────────────────────────────────────────────────────

message DishGetObstructionMapResponse {
  uint32 num_rows = 1;
  uint32 num_cols = 2;
  repeated float snr = 3;              // num_rows*num_cols floats (packed)
  float min_elevation_deg = 4;         // row 0 elevation (outer ring)
  float max_theta_deg = 5;             // 90 - min_elevation
  ObstructionMapReferenceFrame map_reference_frame = 6;
}

// ── enums (value names local; numbers wire-identical to the API) ─────────

enum UserMobilityClass {
  MOBILITY_UNKNOWN = 0;
  MOBILITY_STATIONARY = 1;
  MOBILITY_NOMADIC = 2;
  MOBILITY_MOBILE = 3;
}

enum UserClassOfService {
  COS_UNKNOWN = 0;
  COS_CONSUMER = 1;
  COS_BUSINESS = 2;
  COS_BUSINESS_PLUS = 3;
  COS_COMMERCIAL_AVIATION = 4;
}

enum SoftwareUpdateState {
  SWU_UNKNOWN = 0;
  SWU_IDLE = 1;
  SWU_FETCHING = 2;
  SWU_PRE_CHECK = 3;
  SWU_WRITING = 4;
  SWU_POST_CHECK = 5;
  SWU_REBOOT_REQUIRED = 6;
  SWU_DISABLED = 7;
  SWU_FAULTED = 8;
}

enum UtDisablementCode {
  UTD_UNKNOWN_STATE = 0;
  UTD_OKAY = 1;
  UTD_NO_ACTIVE_ACCOUNT = 2;
  UTD_TOO_FAR_FROM_SERVICE_ADDRESS = 3;
  UTD_IN_OCEAN = 4;
  UTD_BLOCKED_COUNTRY = 6;
  UTD_DATA_OVERAGE_SANDBOX_POLICY = 7;
  UTD_CELL_IS_DISABLED = 8;
  UTD_ROAM_RESTRICTED = 10;
  UTD_UNKNOWN_LOCATION = 11;
  UTD_ACCOUNT_DISABLED = 12;
  UTD_UNSUPPORTED_VERSION = 13;
  UTD_MOVING_TOO_FAST_FOR_POLICY = 14;
  UTD_UNDER_AVIATION_FLYOVER_LIMITS = 15;
  UTD_BLOCKED_AREA = 16;
}

enum RateLimitReason {
  RLR_UNKNOWN = 0;
  RLR_NO_LIMIT = 1;
  RLR_POLICY_LIMIT = 2;
  RLR_USER_CUSTOM_LIMIT = 3;
  RLR_OVERAGE_LIMIT = 5;
  RLR_LOW_SPEED_POLICY_LIMIT = 6;
}

enum RebootReason {
  RR_NONE = 0;
  RR_MANUAL = 1;
  RR_LOSS_OF_COMM = 2;
  RR_SWUPDATE_NOW = 3;
  RR_SWUPDATE_SCHEDULED = 4;
  RR_APP = 5;
  RR_EMC = 6;
  RR_FACTORY_RESET = 7;
  RR_TEST_CASE = 8;
  RR_THERMAL_POWER_CUT = 9;
  RR_CRITICAL_PROCESS_DIED = 10;
  RR_NO_RF_READY = 11;
  RR_POSTPONED_LOSS_OF_COMM = 12;
  RR_SWUPDATE_STATIONARY = 13;
  RR_AAP_CRASH = 14;
  RR_XP70_SACS = 15;
  RR_INE_FAILED = 16;
  RR_KERNEL_TAINTED = 17;
}

enum AttitudeEstimationState {
  AES_FILTER_RESET = 0;
  AES_FILTER_UNCONVERGED = 1;
  AES_FILTER_CONVERGED = 2;
  AES_FILTER_FAULTED = 3;
  AES_FILTER_INVALID = 4;
}

enum ActuatorState {
  ACT_IDLE = 0;
  ACT_FULL_TILT = 1;
  ACT_ROTATE = 2;
  ACT_TILT = 3;
  ACT_UNWRAP_POSITIVE = 4;
  ACT_UNWRAP_NEGATIVE = 5;
  ACT_TILT_TO_STOWED = 6;
  ACT_FAULTED = 7;
  ACT_WAIT_TIL_STATIC = 8;
  ACT_DRIVE_TO_MOBILE_POSITION = 9;
  ACT_MOBILE_WAIT = 10;
}

enum HasActuators {
  ACTUATORS_UNKNOWN = 0;
  ACTUATORS_YES = 1;
  ACTUATORS_NO = 2;
}

enum PowerSource {
  POWER_SOURCE_UNKNOWN = 0;
  POWER_SOURCE_MAINS = 1;
  POWER_SOURCE_BATTERY = 2;
  POWER_SOURCE_SOLAR = 3;
}

enum HardwareIndex {
  HWI_UNKNOWN = 0;
  HWI_ROUTER_GEN_1 = 1010;
  HWI_ROUTER_GEN_2 = 1020;
  HWI_ROUTER_MINI_COHOUSED_1 = 1021;
  HWI_ROUTER_BLOCK_2_OR_3 = 1022;
  HWI_ROUTER_GEN_3 = 1030;
  HWI_ROUTER_BLOCK_4 = 1031;
  HWI_ROUTER_BLOCK_4P1 = 1032;
  HWI_ROUTER_MINI_1 = 1040;
  HWI_ROUTER_MINI_COHOUSED_2 = 1041;
  HWI_ROUTER_GEN_4 = 1050;
}

enum ObstructionMapReferenceFrame {
  FRAME_UNKNOWN = 0;
  FRAME_EARTH = 1;
  FRAME_UT = 2;
}
